<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa; /* Light background color */
        }

        .container {
            max-width: 400px; /* Set a max width for the form */
            margin-top: 100px; /* Center vertically */
        }

        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
    </style>
</head>
<body>
<div th:if="${#authorization.expression('isAuthenticated()')}" class="container">
    <h4 class="text-center mb-4" th:text="'Welcome, ' + ${displayName}"></h4>
    <hr/>
    <p class="text-center mb-4">Congratulations! You've successfully created your account.</p>
    <div class="text-center mb-4">
        <p th:if="${#authorization.expression('hasAuthority(''P_MANAGE_CLASSES'')')}">
            You now have access as a <strong>teacher</strong>.
        </p>
        <p th:if="${#authorization.expression('hasAuthority(''P_SHARED_CLASS'')')}">
            You now have access to a shared class.
        </p>
        <p th:unless="${#authorization.expression('hasAuthority(''P_MANAGE_CLASSES'')')
              or #authorization.expression('hasAuthority(''P_SHARED_CLASS'')')}">
            You now have access as an <strong>individual user</strong>.
        </p>
        <a href="/"><span>Let's get started</span></a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
