<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Account Profile & Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa; /* Light background color */
        }

        .container {
            margin-top: 100px; /* Center vertically */
        }

        .form-switch .form-check-input:checked {
            background-color: #ff6f61; /* Lighter red when checked */
        }

        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
    </style>
</head>
<body>

<div th:if="${#authorization.expression('isAuthenticated()')}" class="container py-4">

    <!-- Page Header -->
    <div class="text-center mb-4">
        <h4 class="mb-2 fw-bold">Account Profile & Settings</h4>
        <h6 class="text-muted">View and update your account details, profile and more.</h6>
    </div>

    <!-- Main Content: Flex container -->
    <div class="d-flex flex-column flex-lg-row gap-4">

        <!-- Left: School Info Card -->
        <div class="flex-shrink-0" style="width: 100%; max-width: 350px;">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body bg-light rounded p-4">
                    <!-- School Profile Logo -->
                    <img th:src="@{${schoolInfo.logo() != null && !#strings.isEmpty(schoolInfo.logo()) ? schoolInfo.logo() : './education.png'}}"
                         class="rounded-circle mb-3 border border-secondary"
                         alt="School Profile Logo"
                         width="150" height="150"/>

                    <!-- Teacher Name -->
                    <h5 class="fw-bold mb-2" th:text="${schoolInfo.name()}"></h5>

                    <hr class="my-3"/>

                    <!-- School Name -->
                    <p class="mb-0">
                        My teacher: <span class="fw-semibold" th:text="${schoolInfo.teacherName()}"></span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Right: Forms Section -->
        <div class="flex-grow-1">

            <!-- Profile Form -->
            <div class="mb-4">
                <form id="profileForm" th:action="@{/users/profile}" th:object="${userProfile}" method="post" class="pb-3">

                    <div class="border rounded bg-light p-3 mb-3 d-flex flex-column flex-md-row gap-3">
                        <div class="flex-fill">
                            <label for="firstName" class="form-label fw-semibold">First Name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}"
                                 th:errors="*{firstName}"></div>
                        </div>
                        <div class="flex-fill">
                            <label for="lastName" class="form-label fw-semibold">Last Name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}"
                                 th:errors="*{lastName}"></div>
                        </div>
                    </div>
                    <div class="border rounded bg-light p-3 mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>
                    <p class="mb-3 text-muted">A platform user since October 8, 2024</p>

                    <div class="d-flex justify-content-end">
                        <button class="btn btn-outline-danger" type="submit">Update profile</button>
                    </div>

                </form>
            </div>

            <hr/>

            <!-- Settings Form -->
            <div>
                <form id="settingsForm" th:action="@{/users/settings}" th:object="${settings}" method="post" class="pb-3">

                    <h6 class="pt-3">Select cards limit for exercise</h6>
                    <div class="border rounded bg-light p-3 mb-3 d-flex align-items-center justify-content-between flex-wrap">
                        <label for="cardsLimit" class="mb-2 mb-sm-0 me-sm-3 fw-semibold">Max cards per exercise:</label>
                        <input class="form-control w-auto" type="number" id="cardsLimit" name="cardsLimitExercise"
                               th:field="*{cardsLimitExercise}" step="1" min="1" max="100"/>
                    </div>

                    <div class="border rounded bg-light p-3 mb-3 d-flex align-items-center justify-content-between flex-wrap">
                        <div class="me-sm-3 mb-2 mb-sm-0">
                            <p class="mb-1 fw-semibold">School updates</p>
                            <small class="text-muted">New dictionaries syncs and updates.</small>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="activitySwitch"
                                   th:field="*{schoolUpdatesEnabled}"/>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button class="btn btn-outline-secondary" type="submit">Save Settings</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
